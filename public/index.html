<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New World</title>
<link rel="stylesheet" href="/vendor/maplibre-gl.css">
<style>
  html, body, #map { margin: 0; height: 100%; }
  body { font: 13px/1.4 system-ui, sans-serif; color: #1f2933; background: #d9dde0; }
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 2; width: 340px; padding: 12px;
    background: #fffffff2; border-radius: 8px; box-shadow: 0 1px 6px #0003;
  }
  #panel h1 { margin: 0 0 8px; font-size: 15px; }
  .row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  select, input, button { font: inherit; padding: 5px 7px; border: 1px solid #b8c0c8; border-radius: 5px; background: #fff; min-width: 0; }
  #worlds { flex: 1; }
  input[type=number] { width: 58px; }
  button { cursor: pointer; background: #f3f5f7; }
  button.on { background: #2f6fde; border-color: #2f6fde; color: #fff; }
  button.primary { flex: 1; background: #2f6fde; border-color: #2f6fde; color: #fff; font-weight: 600; }
  button:disabled { opacity: 0.55; cursor: default; }
  #status { color: #52606d; min-height: 18px; }
  #bar { height: 4px; background: #e4e7eb; border-radius: 2px; overflow: hidden; margin: 6px 0; visibility: hidden; }
  #bar div { height: 100%; width: 0; background: #2f6fde; transition: width 0.2s; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: #52606d; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 2px 4px; white-space: nowrap; }
  th { font-weight: 600; color: #52606d; border-bottom: 1px solid #d5dae0; }
  #stats { max-height: 40vh; overflow: auto; }
  #totals { margin-top: 6px; color: #52606d; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>New World</h1>
  <div class="row">
    <select id="worlds" aria-label="World"></select>
    <button id="new">New</button>
    <button id="threed" title="Tilt the map and show terrain and buildings in 3D">3D</button>
    <button id="delete" title="Delete this world">✕</button>
  </div>
  <div class="row">
    <button id="expand" class="primary">Expand</button>
    <input id="km" type="number" min="2" max="20" step="2" value="2" aria-label="Kilometres to add">
    <span>km</span>
    <select id="sides" aria-label="Where to add land">
      <option value="all">all sides</option>
      <option value="view">toward view</option>
      <option value="n">north</option>
      <option value="e">east</option>
      <option value="s">south</option>
      <option value="w">west</option>
    </select>
  </div>
  <div id="bar"><div></div></div>
  <div id="status"></div>
  <details>
    <summary>Generation timings</summary>
    <div id="stats"></div>
  </details>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
